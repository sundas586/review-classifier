<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#f6a15a"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1c1c1e" flood-opacity="0.16"/>
    </filter>
  </defs>

  <circle cx="350" cy="190" r="140" fill="url(#g1)" opacity="0.55" filter="url(#blur)"/>
  <circle cx="150" cy="320" r="90" fill="#d7f24d" opacity="0.7" filter="url(#blur)"/>

  <!-- main card: a few reviews, each with stars and a sentiment -->
  <g filter="url(#shadow)"><rect x="150" y="62" width="300" height="256" rx="26" fill="#fff"/></g>
  <text x="176" y="100" font-size="15" font-weight="700" fill="#1c1c1e">Customer reviews</text>
  <rect x="350" y="84" width="76" height="22" rx="11" fill="#d7f24d"/>
  <text x="388" y="99" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1c1c1e">Analysing...</text>

  <g>
    <rect x="170" y="120" width="260" height="54" rx="16" fill="#f5f5f7"/>
    <circle cx="196" cy="147" r="14" fill="#b8a9f8"/>
    <text x="220" y="142" font-size="11" fill="#f5b942">★★★★★</text>
    <rect x="220" y="150" width="112" height="6" rx="3" fill="#d9d9de"/>
    <rect x="220" y="161" width="80" height="6" rx="3" fill="#e6e6ea"/>
    <rect x="348" y="136" width="70" height="22" rx="11" fill="#a6c814"/>
    <text x="383" y="151" font-size="10" font-weight="700" text-anchor="middle" fill="#1c1c1e">positive</text>
  </g>
  <g>
    <rect x="170" y="184" width="260" height="54" rx="16" fill="#f5f5f7"/>
    <circle cx="196" cy="211" r="14" fill="#1c1c1e"/>
    <text x="220" y="206" font-size="11" fill="#f5b942">★★<tspan fill="#d9d9de">★★★</tspan></text>
    <rect x="220" y="214" width="124" height="6" rx="3" fill="#d9d9de"/>
    <rect x="220" y="225" width="70" height="6" rx="3" fill="#e6e6ea"/>
    <rect x="348" y="200" width="70" height="22" rx="11" fill="#ef5350"/>
    <text x="383" y="215" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">negative</text>
  </g>
  <g>
    <rect x="170" y="248" width="260" height="54" rx="16" fill="#f5f5f7"/>
    <circle cx="196" cy="275" r="14" fill="#d7f24d"/>
    <text x="220" y="270" font-size="11" fill="#f5b942">★★★<tspan fill="#d9d9de">★★</tspan></text>
    <rect x="220" y="278" width="100" height="6" rx="3" fill="#d9d9de"/>
    <rect x="220" y="289" width="88" height="6" rx="3" fill="#e6e6ea"/>
    <rect x="348" y="264" width="70" height="22" rx="11" fill="#b8a9f8"/>
    <text x="383" y="279" font-size="10" font-weight="700" text-anchor="middle" fill="#1c1c1e">neutral</text>
  </g>

  <!-- sentiment split -->
  <g filter="url(#shadow)"><rect x="424" y="22" width="124" height="128" rx="28" fill="#fff"/></g>
  <g transform="rotate(-90 486 80)" fill="none" stroke-width="14">
    <circle cx="486" cy="80" r="30" stroke="#a6c814" stroke-dasharray="103.7 188.5"/>
    <circle cx="486" cy="80" r="30" stroke="#b8a9f8" stroke-dasharray="37.7 188.5" stroke-dashoffset="-103.7"/>
    <circle cx="486" cy="80" r="30" stroke="#ef5350" stroke-dasharray="47.1 188.5" stroke-dashoffset="-141.4"/>
  </g>
  <text x="486" y="85" font-size="15" font-weight="800" text-anchor="middle" fill="#1c1c1e">55%</text>
  <text x="486" y="132" font-size="10" text-anchor="middle" fill="#6b6b73">positive reviews</text>

  <!-- tags found in the reviews -->
  <rect x="22" y="104" width="108" height="30" rx="15" fill="#1c1c1e"/>
  <text x="76" y="123" font-size="11.5" font-weight="700" text-anchor="middle" fill="#fff">late delivery</text>
  <rect x="30" y="228" width="116" height="30" rx="15" fill="#b8a9f8"/>
  <text x="88" y="247" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c1c1e">great quality</text>
  <rect x="412" y="304" width="118" height="30" rx="15" fill="#d7f24d"/>
  <text x="471" y="323" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c1c1e">good value</text>
  <rect x="380" y="350" width="130" height="30" rx="15" fill="#fff"/>
  <circle cx="400" cy="365" r="5" fill="#ef5350"/>
  <text x="456" y="369" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1c1c1e">priority: high</text>

  <!-- sparkles -->
  <path d="M96 52 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#8b7cf6"/>
  <path d="M536 190 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#f6a15a"/>
</svg>
