<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#f6a15a"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c1c1e" flood-opacity="0.15"/>
    </filter>
    <pattern id="tape" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#f5b942"/><rect x="14" width="14" height="28" fill="#1c1c1e"/>
    </pattern>
  </defs>

  <circle cx="300" cy="170" r="130" fill="url(#g1)" opacity="0.5" filter="url(#blur)"/>
  <circle cx="110" cy="290" r="80" fill="#d7f24d" opacity="0.65" filter="url(#blur)"/>

  <!-- message from the team -->
  <g filter="url(#shadow)">
    <rect x="100" y="44" width="300" height="124" rx="30" fill="#fff"/>
    <polygon points="140,166 118,208 184,166" fill="#fff"/>
  </g>
  <circle cx="136" cy="80" r="14" fill="#d7f24d"/>
  <rect x="160" y="72" width="120" height="10" rx="5" fill="#1c1c1e"/>
  <rect x="130" y="108" width="236" height="10" rx="5" fill="#d9d9de"/>
  <rect x="130" y="130" width="170" height="10" rx="5" fill="#e6e6ea"/>

  <!-- someone typing -->
  <g filter="url(#shadow)">
    <rect x="250" y="190" width="212" height="84" rx="28" fill="#b8a9f8"/>
    <polygon points="430,272 456,306 398,272" fill="#b8a9f8"/>
  </g>
  <circle cx="306" cy="232" r="9" fill="#fff"/>
  <circle cx="340" cy="232" r="9" fill="#fff" opacity="0.75"/>
  <circle cx="374" cy="232" r="9" fill="#fff" opacity="0.5"/>

  <!-- gears -->
  <g transform="translate(452 106)">
    <circle r="30" fill="none" stroke="#1c1c1e" stroke-width="12" stroke-dasharray="11.8 11.8"/>
    <circle r="26" fill="#1c1c1e"/><circle r="10" fill="#d7f24d"/>
  </g>
  <g transform="translate(96 244)">
    <circle r="16" fill="none" stroke="#8b7cf6" stroke-width="8" stroke-dasharray="6.28 6.28"/>
    <circle r="13" fill="#8b7cf6"/><circle r="5" fill="#fff"/>
  </g>

  <!-- construction tape -->
  <g transform="rotate(-5 280 330)">
    <rect x="30" y="312" width="500" height="36" rx="6" fill="url(#tape)"/>
    <rect x="150" y="314" width="260" height="32" rx="16" fill="#fff"/>
    <text x="280" y="335" font-size="14" font-weight="800" text-anchor="middle" fill="#1c1c1e" letter-spacing="1.5">UNDER CONSTRUCTION</text>
  </g>

  <path d="M70 70 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#8b7cf6"/>
  <path d="M520 220 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#f6a15a"/>
</svg>
