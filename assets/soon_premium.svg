<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#f6a15a"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c1c1e" flood-opacity="0.15"/>
    </filter>
    <pattern id="tape" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#f5b942"/><rect x="14" width="14" height="28" fill="#1c1c1e"/>
    </pattern>
  </defs>

  <circle cx="290" cy="150" r="130" fill="url(#g1)" opacity="0.5" filter="url(#blur)"/>
  <circle cx="470" cy="290" r="80" fill="#d7f24d" opacity="0.65" filter="url(#blur)"/>

  <!-- free plan card -->
  <g filter="url(#shadow)"><rect x="52" y="150" width="150" height="150" rx="24" fill="#fff"/></g>
  <rect x="72" y="172" width="56" height="22" rx="11" fill="#d7f24d"/>
  <text x="100" y="187" font-size="11" font-weight="800" text-anchor="middle" fill="#1c1c1e">Free</text>
  <rect x="72" y="212" width="100" height="9" rx="4.5" fill="#d9d9de"/>
  <rect x="72" y="232" width="84" height="9" rx="4.5" fill="#e6e6ea"/>
  <rect x="72" y="252" width="92" height="9" rx="4.5" fill="#e6e6ea"/>
  <text x="127" y="286" font-size="10" text-anchor="middle" fill="#6b6b73">You are here</text>

  <!-- premium plan card -->
  <g filter="url(#shadow)"><rect x="358" y="150" width="150" height="150" rx="24" fill="#fff"/></g>
  <rect x="358" y="150" width="150" height="150" rx="24" fill="none" stroke="#8b7cf6" stroke-width="2.5" stroke-dasharray="7 6"/>
  <rect x="378" y="172" width="76" height="22" rx="11" fill="url(#g1)"/>
  <text x="416" y="187" font-size="11" font-weight="800" text-anchor="middle" fill="#fff">Premium</text>
  <rect x="378" y="212" width="100" height="9" rx="4.5" fill="#d9d9de"/>
  <rect x="378" y="232" width="70" height="9" rx="4.5" fill="#e6e6ea"/>
  <text x="433" y="286" font-size="10" text-anchor="middle" fill="#6b6b73">Coming soon</text>

  <!-- gem -->
  <g filter="url(#shadow)">
    <polygon points="222,104 254,58 326,58 358,104 290,196" fill="url(#g1)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="2" stroke-linejoin="round">
    <path d="M222 104 L358 104"/>
    <path d="M254 58 L276 104 L290 196"/>
    <path d="M326 58 L304 104 L290 196"/>
    <path d="M276 104 L290 58 L304 104"/>
  </g>

  <!-- construction tape -->
  <g transform="rotate(-5 280 336)">
    <rect x="30" y="318" width="500" height="36" rx="6" fill="url(#tape)"/>
    <rect x="170" y="320" width="220" height="32" rx="16" fill="#fff"/>
    <text x="280" y="341" font-size="14" font-weight="800" text-anchor="middle" fill="#1c1c1e" letter-spacing="1.5">COMING SOON</text>
  </g>

  <path d="M70 80 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#8b7cf6"/>
  <path d="M500 90 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z" fill="#f6a15a"/>
  <path d="M430 40 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#d7f24d"/>
</svg>
